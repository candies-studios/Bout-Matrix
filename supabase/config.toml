# Supabase CLI configuration (local development). Hosted projects: mirror the [auth] settings
# in Dashboard → Authentication.
project_id = "fight-desk"

[api]
enabled = true
port = 54321
# Only `public` is exposed. Helpers live in `private`, which PostgREST cannot reach.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/admin/login"]
jwt_expiry = 3600
# Nobody can self-register. Admins and coaches are invited.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "10MiB"

# Edge Functions verify the caller themselves (public forms are anonymous; admin functions check the
# user JWT with Supabase Auth and permissions in the database), so gateway JWT checks are disabled.
[functions.register-fighter]
verify_jwt = false
import_map = "./functions/deno.json"
[functions.register-coach]
verify_jwt = false
import_map = "./functions/deno.json"
